<!DOCTYPE html>
<!-- HTML5 document declaration. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KASI NIGHT HUB | Enquiry</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<header><nav class="navbar">
  <a class="logo" href="../index.html">KASI <span>NIGHT HUB</span></a>
  <ul class="nav-links">
    <li><a href="../index.html">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="shop.html">Shop</a></li>
    <li><a class="active" href="enquiry.html">Enquiry</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav></header>

<main>
<section class="page-banner">
  <p class="eyebrow">BOOKINGS & QUESTIONS</p>
  <h1>Make an Enquiry</h1>
  <p>Ask about our music, events, clothing, volunteering or sponsorship opportunities.</p>
</section>

<section class="section">
<form class="form-card wide" id="enquiryForm">
  <div class="form-grid">
    <div>
      <label for="fullName">Full Name</label>
      <input id="fullName" name="fullName" type="text" minlength="2" required>
    </div>
    <div>
      <label for="email">Email Address</label>
      <input id="email" name="email" type="email" required>
    </div>
    <div>
      <label for="service">Enquiry Type</label>
      <select id="service" name="service" required>
        <option value="">Select an option</option>
        <option value="DJ Booking">DJ Booking</option>
        <option value="Event Enquiry">Event Enquiry</option>
        <option value="Clothing Enquiry">Clothing Enquiry</option>
        <option value="Volunteer">Volunteer</option>
        <option value="Sponsor">Sponsor</option>
      </select>
    </div>
    <div>
      <label for="date">Preferred Date</label>
      <input id="date" name="date" type="date">
    </div>
  </div>

  <label for="details">Details</label>
  <textarea id="details" name="details" rows="7" minlength="10" placeholder="Tell us about your booking or enquiry..." required></textarea>

  <button class="btn" type="submit">Submit Enquiry</button>
  <p class="form-message" id="enquiryMessage" aria-live="polite"></p>
</form>
</section>
</main>

<footer><p>&copy; 2026 KASI NIGHT HUB. All rights reserved.</p></footer>

<script>
document.getElementById("enquiryForm").addEventListener("submit", function (event) {
  event.preventDefault();

  if (!this.checkValidity()) {
    this.reportValidity();
    return;
  }

  const name = document.getElementById("fullName").value.trim();
  const service = document.getElementById("service").value;
  const date = document.getElementById("date").value;
  const message = document.getElementById("enquiryMessage");

  let response = "";

  if (service === "DJ Booking") {
    response = "DJ bookings are available from R2,500, depending on the event, location and duration.";
  } else if (service === "Event Enquiry") {
    response = "Event enquiries are subject to date and venue availability. We will confirm the details and provide a quotation.";
  } else if (service === "Clothing Enquiry") {
    response = "Clothing availability depends on the item and size. We will confirm stock and the current price with you.";
  } else if (service === "Volunteer") {
    response = "Thank you for your interest in volunteering. We will review your enquiry and contact you about available opportunities.";
  } else if (service === "Sponsor") {
    response = "Thank you for your sponsorship interest. We will contact you with available sponsorship options and packages.";
  }

  const dateText = date ? " Your preferred date is " + new Date(date + "T00:00:00").toLocaleDateString("en-ZA") + "." : "";

  message.textContent = "Thank you, " + name + "! " + response + dateText + " We will get back to you at " + document.getElementById("email").value + ".";
  this.reset();
});
</script>
</body>
</html>
