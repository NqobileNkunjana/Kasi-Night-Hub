<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KASI NIGHT HUB | Enquiry</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<header><nav class="navbar">
  <a class="logo" href="../index.html">KASI <span>NIGHT HUB</span></a>
  
  <ul class="nav-links">
    <li><a href="../index.html">Home</a></li><li><a href="about.html">About</a></li>
    <li><a href="shop.html">Shop</a></li><li><a class="active" href="enquiry.html">Enquiry</a></li><li><a href="contact.html">Contact</a></li>
  </ul>
</nav></header>

<main>
<section class="page-banner"><p class="eyebrow">BOOKINGS & QUESTIONS</p><h1>Make an Enquiry</h1><p>Tell us what you need and we will get back to you.</p></section>

<section class="section">
<form class="form-card wide" id="enquiryForm">
  <div class="form-grid">
    <div><label for="fullName">Full Name</label><input id="fullName" type="text" required></div>
    <div><label for="email">Email Address</label><input id="email" type="email" required></div>
    <div><label for="service">Enquiry Type</label>
      <select id="service" required>
        <option value="">Select an option</option>
        <option>DJ Booking</option><option>Event Enquiry</option><option>Clothing Enquiry</option><option>General Enquiry</option>
      </select>
    </div>
    <div><label for="date">Preferred Date</label><input id="date" type="date"></div>
  </div>
  <label for="details">Details</label>
  <textarea id="details" rows="7" placeholder="Tell us about your booking or enquiry..." required></textarea>
  <button class="btn" type="submit">Submit Enquiry</button>
  <p class="form-message" id="enquiryMessage"></p>
</form>
</section>
</main>
<footer><p>&copy; 2026 KASI NIGHT HUB. All rights reserved.</p></footer>

</body>
</html>
