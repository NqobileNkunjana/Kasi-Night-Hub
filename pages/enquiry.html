<!DOCTYPE html>
<!-- HTML5 document declaration. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KASI NIGHT HUB | Enquiry</title>
  <meta name="description" content="Contact KASI NIGHT HUB about DJ bookings, events, clothing, volunteering and sponsorship opportunities.">
  <meta name="theme-color" content="#080808">
  <meta property="og:site_name" content="KASI NIGHT HUB">
  <meta property="og:title" content="KASI NIGHT HUB | Enquiry">
  <meta property="og:description" content="Contact KASI NIGHT HUB about DJ bookings, events, clothing, volunteering and sponsorship opportunities.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<header><nav class="navbar">
  <a class="logo" href="../index.html">KASI <span>NIGHT HUB</span></a>
    <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-controls="primary-navigation" aria-expanded="false">☰</button>
    <ul class="nav-links" id="primary-navigation">
    <li><a href="../index.html">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="shop.html">Shop</a></li>
    <li><a class="active" aria-current="page" href="enquiry.html">Enquiry</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav></header>

<main>
<section class="page-banner">
  <p class="eyebrow">BOOKINGS & QUESTIONS</p>
  <h1>Make an Enquiry</h1>
  <p>Ask about our music, events, clothing, volunteering or sponsorship opportunities.</p>
</section>

<section class="section">
<form class="form-card wide" id="enquiryForm">
  <div class="form-grid">
    <div>
      <label for="fullName">Full Name</label>
      <input id="fullName" name="fullName" type="text" autocomplete="name" minlength="2" maxlength="80" required>
    </div>
    <div>
      <label for="email">Email Address</label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
    </div>
    <div>
      <label for="service">Enquiry Type</label>
      <select id="service" name="service" required>
        <option value="">Select an option</option>
        <option value="DJ Booking">DJ Booking</option>
        <option value="Event Enquiry">Event Enquiry</option>
        <option value="Clothing Enquiry">Clothing Enquiry</option>
        <option value="Volunteer">Volunteer</option>
        <option value="Sponsor">Sponsor</option>
      </select>
    </div>
    <div>
      <label for="date">Preferred Date</label>
      <input id="date" name="date" type="date">
    </div>
  </div>

  <label for="details">Details</label>
  <textarea id="details" name="details" rows="7" minlength="10" maxlength="2000" placeholder="Tell us about your booking or enquiry..." required></textarea>

  <button class="btn" type="submit">Submit Enquiry</button>
  <p class="form-message" id="enquiryMessage" aria-live="polite"></p>
</form>
</section>
</main>

<footer><p>&copy; 2026 KASI NIGHT HUB. All rights reserved.</p></footer>

  <script src="../assets/js/script.js" defer></script>
</body>
</html>
